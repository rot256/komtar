name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: read

jobs:
  metadata:
    name: Read release version
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.package.outputs.publish }}
      tag: ${{ steps.package.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package version
        id: package
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "komtar") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read the komtar package version" >&2
            exit 1
          fi

          previous_version="$(
            git show "$BEFORE_SHA:Cargo.toml" |
              awk '
                /^\[package\]$/ { in_package = 1; next }
                /^\[/ { in_package = 0 }
                in_package && /^version[[:space:]]*=/ {
                  value = $0
                  sub(/^[^=]*=[[:space:]]*"/, "", value)
                  sub(/".*$/, "", value)
                  print value
                  exit
                }
              '
          )"

          if [ "$version" = "$previous_version" ]; then
            echo "Cargo.toml changed, but the package version remains $version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package version changed from $previous_version to $version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require a new version
        if: steps.package.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; bump the Cargo.toml version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    if: needs.metadata.outputs.publish == 'true'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            force-cross: false
          - name: Linux AMD64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            force-cross: true
          - name: Linux ARM64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            force-cross: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          cross-version: v0.2.5
          force-use-cross: ${{ matrix.force-cross }}
          use-rust-cache: false

      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        env:
          BINARY: target/${{ matrix.target }}/release/komtar
        run: |
          file "$BINARY"
          file "$BINARY" | grep -Eq 'statically linked|static-pie linked'

      - name: Verify macOS ARM64 binary
        if: runner.os == 'macOS'
        env:
          BINARY: target/${{ matrix.target }}/release/komtar
        run: |
          file "$BINARY"
          file "$BINARY" | grep -q 'arm64'

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/komtar-$TARGET.tar.gz" komtar
          shasum -a 256 "dist/komtar-$TARGET.tar.gz" > "dist/komtar-$TARGET.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komtar-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            tag_object="$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message="Release $RELEASE_TAG" \
              -f object="$RELEASE_SHA" \
              -f type=commit \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              -f "tagger[date]=$tagged_at" \
              --jq .sha)"
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$tag_object" >/dev/null
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            gh release upload "$RELEASE_TAG" dist/* --clobber
          fi
