name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            force-cross: false
          - name: Linux AMD64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            force-cross: true
          - name: Linux ARM64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            force-cross: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          cross-version: v0.2.5
          force-use-cross: ${{ matrix.force-cross }}
          use-rust-cache: false

      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        env:
          BINARY: target/${{ matrix.target }}/release/komtar
        run: |
          file "$BINARY"
          file "$BINARY" | grep -Eq 'statically linked|static-pie linked'

      - name: Verify macOS ARM64 binary
        if: runner.os == 'macOS'
        env:
          BINARY: target/${{ matrix.target }}/release/komtar
        run: |
          file "$BINARY"
          file "$BINARY" | grep -q 'arm64'

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/komtar-$TARGET.tar.gz" komtar
          shasum -a 256 "dist/komtar-$TARGET.tar.gz" > "dist/komtar-$TARGET.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komtar-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
