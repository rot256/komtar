[package]
name = "komtar"
version = "0.2.1"
edition = "2024"
description = "Development reverse proxy for queuing browser feedback through a FIFO"
license = "MIT"
repository = "https://github.com/rot256/komtar"
readme = "README.md"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1", "client"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "webpki-roots", "ring", "tls12"] }
hyper-util = { version = "0.1.20", features = ["server", "http1", "client", "client-legacy", "tokio"] }
jiff = "0.2.35"
nix = { version = "0.31.3", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
indexing_slicing = "warn"
must_use_candidate = "warn"
wildcard_enum_match_arm = "warn"
